<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Playwright Workshop</title>

    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/black.css" />

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="plugin/highlight/atom-one-dark.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="./markdown/1-title.md"></section>
        <section
          data-markdown="./markdown/2-menu.md"
          data-separator-vertical="\n----\n"
        ></section>
        <section
          data-markdown="./markdown/3-framework.md"
          data-separator-vertical="\n----\n"
        ></section>
        <section
          data-markdown="./markdown/4-tools.md"
          data-separator-vertical="\n----\n"
        ></section>
        <section
          data-markdown="./markdown/5-basic-usage.md"
          data-separator-vertical="\n----\n"
        ></section>
        <section
          data-markdown="./markdown/6-advanced-usage.md"
          data-separator-vertical="\n----\n"
        ></section>
        <section
          data-markdown="./markdown/7-bonus.md"
          data-separator-vertical="\n----\n"
        ></section>
      </div>
    </div>

    <script src="dist/reveal.js"></script>
    <script src="plugin/notes/notes.js"></script>
    <script src="plugin/markdown/markdown.js"></script>
    <script src="plugin/highlight/highlight.js"></script>
    <script src="plugin/menu/menu.js"></script>
    <script>
      // More info about initialization & config:
      // - https://revealjs.com/initialization/
      // - https://revealjs.com/config/
      Reveal.initialize({
        hash: true,
        navigationMode: "linear",
        // Learn about plugins: https://revealjs.com/plugins/
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMenu],
      });
    </script>
  </body>
</html>
